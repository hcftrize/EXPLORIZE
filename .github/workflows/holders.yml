name: Explorize holders

# Rebuilds the RIZE Top Holders ranking (live balances on 4 chains + governance bonds on Base).
# Separate from the transfer sync on purpose: if one fails, the other keeps working.
# Started by hand only (the daily schedule was removed): the "Unified update explorize" workflow now refreshes the ranking at every
# run, in the same transaction as everything else. Use this one only for a full rebuild from the chains.
# A failed run writes nothing: the previous ranking stays online ("updated X ago" on the page shows its age).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = read and print the top 10, write nothing"
        default: "false"

concurrency:
  group: explorize-holders
  cancel-in-progress: false

jobs:
  holders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ "$DRY_RUN" = "true" ]; then python -u -m indexer.holders --dry-run; else python -u -m indexer.holders; fi
