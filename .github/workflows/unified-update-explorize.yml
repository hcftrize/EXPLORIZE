name: Unified update explorize

# ONE run updates everything the dashboard shows (transfers, trades, liquidity moves, CCIP, top holders, wallet pages), all at
# the SAME blocks / timestamp, in a single database transaction committed at the very end (see indexer/unified.py).
#  - If the data cannot be aligned (a chain not at its head, trades behind the transfers, CCIP not looked up, an RPC error),
#    nothing is published and the site keeps the last good state.
#  - Anomalies (supply / balances differences, CCIP messages that do not reconcile, unreadable transactions) never block:
#    they are written once each, grouped by day, in anomalies/ANOMALIES.txt (committed by the last step of this workflow).
#
# Not scheduled on purpose: it is started from outside, every 5 or 10 minutes, with the GitHub API (workflow_dispatch), e.g.
#   POST https://api.github.com/repos/<owner>/EXPLORIZE/actions/workflows/unified-update-explorize.yml/dispatches   {"ref":"main"}
# Runs never overlap: a new start waits for the current run (and a waiting one is replaced by the newest).
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Give up (nothing published) after this many minutes (the very first run needs about 60)"
        default: "25"

concurrency:
  group: unified-update-explorize
  cancel-in-progress: false

permissions:
  contents: write            # only to commit anomalies/ANOMALIES.txt

jobs:
  unified:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRPC_API_KEY: ${{ secrets.DRPC_API_KEY }}
      MAX_MINUTES: ${{ inputs.max_minutes }}
      RPC_BATCH_SIZE: "10"
      STORAGE_LIMIT_MB: ${{ vars.STORAGE_LIMIT_MB || '900' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u -m indexer unified --max-minutes "${MAX_MINUTES:-25}"
      # Also when the run did not publish: the reason is written in the anomaly file too.
      - name: Commit the new anomalies
        if: always()
        run: |
          if [ -n "$(git status --porcelain anomalies/)" ]; then
            git config user.name "explorize-bot"
            git config user.email "explorize-bot@users.noreply.github.com"
            git add anomalies/ANOMALIES.txt
            git commit -m "anomalies: new entries from the unified update [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "no new anomaly"
          fi
